name: Build Kivex AntiGem APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Parse version.json
        id: version
        run: |
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '1.1.2'))")
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "name=Kivex AntiGem v${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Build Termux Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleTermuxDebug

      - name: Prepare Output
        run: |
          mkdir -p output
          find app/build/outputs/apk/termux/debug -name "*.apk" -exec cp {} output/kivex-antigem-termux-debug.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivex-antigem-apk
          path: output/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: "Automated Kivex AntiGem build."
          generate_release_notes: false
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
